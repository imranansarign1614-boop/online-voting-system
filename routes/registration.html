<html>

<head>
    <title>Online Voting System</title>
    <link rel="stylesheet" href="../css/stylesheet.css">
</head>
<body>
    <style>
        #address {
            width: 380px;
        }
        #photo {
            border: 2px solid black;
            width: 380px;
            border-radius: 5px;        
        }
        #role {
            border: 2px solid black;
            width: 380px;
            border-radius: 5px;     
        }
    </style>
    <center>
    <div id="headersection">
        <h1>Online Voting System</h1>
    </div>
    <hr>
    <h2>Fill in your details to register</h2>
    <div id="bodysection">
        <form action="../api/register.php" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Enter Name" required>
            <input type="number" name="mobile" placeholder="Enter Mobile Number" required><br><br>
            <input type="password" name="password" placeholder="Enter Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required><br><br>
            <input id="address" type="text" name="address" placeholder="Enter Address" required><br><br>
            <center>
            <div id="photo">
                upload image:<input type="file" name="photo">
            </div><br>
            <div id="role">
                select role: <select id="dropbox" name="role">
                <option value="1">Voter</option>
                <option value="2">Candidate</option>
                <option value="0">admin</option>
            </select>
            </div><br>
            </center>
            <button id="registerbtn" type="submit">Register</button><br><br>
            already have an account? <a href="../index.html">Login here</a>
        </form> 
    </div>
    </center>
</body>

</html>
